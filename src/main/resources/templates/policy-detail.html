<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
  <meta charset="UTF-8"/>
  <title>Poliçe Detayı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <div th:if="${!#strings.isEmpty(ok)}"  class="alert alert-success" th:text="${ok}"></div>
  <div th:if="${!#strings.isEmpty(err)}" class="alert alert-danger"  th:text="${err}"></div>

  <div class="card">
    <div class="card-body">
      <h4 class="mb-3">Poliçe Detayı</h4>
      <dl class="row">
        <dt class="col-sm-3">Poliçe No</dt>
        <dd class="col-sm-9" th:text="${policy.policyNumber}">P-XXXX</dd>

        <dt class="col-sm-3">Müşteri</dt>
        <dd class="col-sm-9" th:text="${policy.customer.name}">—</dd>

        <dt class="col-sm-3">Araç</dt>
        <dd class="col-sm-9" th:text="${policy.car.plate}">—</dd>

        <dt class="col-sm-3">Dönem</dt>
        <dd class="col-sm-9">
          <span th:text="${policy.startDate}"></span> – <span th:text="${policy.endDate}"></span>
        </dd>

        <dt class="col-sm-3">Durum</dt>
        <dd class="col-sm-9" th:text="${policy.status}">ACTIVE</dd>

        <dt class="col-sm-3">Toplam</dt>
        <dd class="col-sm-9" th:text="${policy.total}">0</dd>
      </dl>

      <a href="/policies" class="btn btn-outline-secondary">Listeye Dön</a>
    </div>
  </div>
</div>
</body>
</html>
