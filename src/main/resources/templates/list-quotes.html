<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Teklifler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{ background:#f7f8fb; }
    .card-soft{ border:0; border-radius:18px; box-shadow:0 12px 30px rgba(16,24,40,.06); }
    .badge-pending{ background:#fff6e6; color:#b45309; }
    .badge-accepted{ background:#e8faf0; color:#166534; }
    .badge-expired{ background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-shield-check text-primary me-1"></i>Staj CRM</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-info" href="/quotes/new"><i class="bi bi-plus-circle"></i> Yeni Teklif</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:if="${!#strings.isEmpty(ok)}"
     class="alert alert-success"
     th:text="${ok}"></div>

<div th:if="${!#strings.isEmpty(err)}"
     class="alert alert-danger"
     th:text="${err}"></div>


  <div class="card card-soft">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Teklifler</h3>
        <a href="/quotes/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Yeni Teklif</a>
      </div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead class="table-light">
          <tr>
            <th>No</th>
            <th>Müşteri</th>
            <th>Araç</th>
            <th>Ürün</th>
            <th>Dönem</th>
            <th>Toplam</th>
            <th>Geçerlilik</th>
            <th>Durum</th>
            <th class="text-end">Aksiyon</th>
          </tr>
          </thead>
          <tbody>
             <tr th:each="q : ${quotes}"
              th:if="${q.status == T(com.example.staj.entity.QuoteStatus).PENDING
              and (q.validUntil == null or q.validUntil.isAfter(T(java.time.LocalDateTime).now()))}">
            <td th:text="${q.quoteNumber}">Q-XXXXXX</td>
            <td th:text="${q.customer.name}">Müşteri</td>
            <td th:text="${q.car.plate}">34ABC123</td>
            <td th:text="${q.product}">KASKO</td>
            <td>
              <span th:text="${q.coverageStart}"></span> –
              <span th:text="${q.coverageEnd}"></span>
            </td>
            <td th:text="${#numbers.formatDecimal(q.grossPremium, 0, 'DEFAULT', 2, 'DEFAULT')}">0.00</td>
            <td th:text="${#temporals.format(q.validUntil, 'dd.MM.yyyy HH:mm')}">—</td>
            <td>
              <span th:classappend="${q.status.name() == 'PENDING'} ? 'badge badge-pending' : ''"
                    th:text="${q.status}">PENDING</span>
              <span th:if="${q.status.name() == 'ACCEPTED'}" class="badge badge-accepted">ACCEPTED</span>
              <span th:if="${q.status.name() == 'EXPIRED'}" class="badge badge-expired">EXPIRED</span>
            </td>
            <td class="text-end">
                          <!-- Sil butonu (sadece PENDING teklifler için) -->
            <form th:if="${q.status == T(com.example.staj.entity.QuoteStatus).PENDING}"
                  th:action="@{'/quotes/' + ${q.id} + '/delete'}"
                  method="post" class="d-inline">
              <input type="hidden"
                    th:if="${_csrf != null}"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">
              <button type="submit" class="btn btn-outline-danger btn-sm"
                      onclick="return confirm('Bu teklifi silmek istediğinize emin misiniz?')">
                Sil
              </button>
            </form>

                  <form th:if="${q.status == T(com.example.staj.entity.QuoteStatus).PENDING
              and (q.validUntil == null or q.validUntil.isAfter(T(java.time.LocalDateTime).now()))}"
      th:action="@{'/quotes/' + ${q.id} + '/accept'}"
      method="post" class="d-inline">

                  <!-- Sadece _csrf varsa ekle -->
                  <input type="hidden"
                        th:if="${_csrf != null}"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                  <button type="submit" class="btn btn-success btn-sm">
                    <i class="bi bi-check2-circle"></i> Onayla & Poliçe
                  </button>
                </form>


            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
