<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Yeni Araba Ekle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-5">
  <h3 class="mb-4">Yeni Araba Ekle</h3>

  <!-- Flash mesajları -->
  <div th:if="${msg}" class="alert alert-success py-2" th:text="${msg}"></div>
  <div th:if="${err}" class="alert alert-danger py-2" th:text="${err}"></div>

  <!-- EKLEME FORMU -->
  <form action="/cars" method="post" class="row g-3 mb-4">
    <div class="col-md-6">
      <label class="form-label">Müşteri</label>
      <select name="customerId" class="form-select" required>
        <option value="" selected disabled>Seçin…</option>
        <option th:each="c : ${customers}" th:value="${c.id}"
                th:text="${c.name + ' (' + c.email + ')'}"></option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Plaka</label>
      <input type="text" name="plate" class="form-control" required
             placeholder="58 DR 827" oninput="this.value=this.value.toUpperCase()">
    </div>

    <div class="col-md-4">
      <label class="form-label">Marka</label>
      <input type="text" name="brand" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Model</label>
      <input type="text" name="carModel" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Model Yılı</label>
      <input type="number" name="modelYear" min="1950" max="2100" class="form-control">
    </div>

    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="col-12 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Kaydet</button>
    </div>
  </form>

  <!-- MEVCUT ARAÇLAR (Satır-içi güncelle) -->
  <div class="card">
    <div class="card-header fw-semibold">Kayıtlı Arabalar</div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th style="width: 22%">Müşteri</th>
          <th style="width: 14%">Plaka</th>
          <th style="width: 18%">Marka</th>
          <th style="width: 18%">Model</th>
          <th style="width: 12%">Model Yılı</th>
          <th style="width: 16%" class="text-end">İşlemler</th>
        </tr>
        </thead>
        <tbody>
<tr th:each="car : ${cars}">
  <!-- Satırın güncelleme formu -->
  <form th:action="@{'/cars/' + ${car.id} + '/update'}" method="post">
    <td>
      <select class="form-select form-select-sm" name="customerId" required>
        <option th:each="c : ${customers}" th:value="${c.id}"
                th:selected="${car.customer != null and car.customer.id == c.id}"
                th:text="${c.name + ' (' + c.email + ')'}"></option>
      </select>
    </td>

    <td>
      <input class="form-control form-control-sm" name="plate"
             th:value="${car.plate}" required
             oninput="this.value=this.value.toUpperCase()">
    </td>

    <td>
      <input class="form-control form-control-sm" name="brand" th:value="${car.brand}">
    </td>

    <td>
    
      <input class="form-control form-control-sm"
             name="carModel"
             th:value="${car.model}">
    </td>

    <td>
      <input type="number" min="1950" max="2100"
             class="form-control form-control-sm" name="modelYear"
             th:value="${car.modelYear}">
    </td>

    <td class="text-end">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button type="submit" class="btn btn-sm btn-primary">Güncelle</button>
      <button form="del-[[${car.id}]]" type="submit"
              class="btn btn-sm btn-outline-danger"
              onclick="return confirm('Silinsin mi?')">Sil</button>
    </td>
  </form>

  <!-- Silme formu (ayrı) -->
  <form th:id="'del-' + ${car.id}" th:action="@{'/cars/' + ${car.id} + '/delete'}" method="post">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  </form>
</tr>

<tr th:if="${#lists.isEmpty(cars)}">
  <td colspan="6" class="text-center text-muted py-4">Henüz kayıtlı araba yok.</td>
</tr>
</tbody>

      </table>
    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
