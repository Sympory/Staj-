<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yeni Araba Ekle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-5">
  <h3 class="mb-4">Yeni Araba Ekle</h3>

  <!-- Flash -->
  <div th:if="${msg}" class="alert alert-success py-2" th:text="${msg}"></div>
  <div th:if="${err}" class="alert alert-danger py-2" th:text="${err}"></div>

  <!-- EKLEME FORMU -->
  <form th:action="@{/cars}" method="post" class="row g-3 mb-4" novalidate>
    <!-- CSRF -->
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="col-md-6">
      <label class="form-label">Müşteri</label>
      <select name="customerId" class="form-select" required>
        <option value="" selected disabled>Seçin…</option>
        <option th:each="c : ${customers}" th:value="${c.id}"
                th:text="${c.name + ' (' + c.email + ')'}"></option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Plaka</label>
      <input type="text" name="plate" class="form-control" required
             placeholder="58 DR 827" oninput="this.value=this.value.toUpperCase()">
    </div>

    <!-- Marka -->
    <div class="col-md-6">
      <label class="form-label">Marka</label>
      <select id="brandSelect" name="brandId" class="form-select" required>
        <option value="" selected disabled>Marka seçin…</option>
        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
      </select>
    </div>

    <!-- Model -->
    <div class="col-md-6">
      <label class="form-label">Model</label>
      <select id="modelSelect" name="modelId" class="form-select" required disabled>
        <option value="" selected disabled>Önce marka seçin…</option>
      </select>
    </div>

    <!-- Model Yılı -->
    <div class="col-md-4">
      <label class="form-label">Model Yılı</label>
      <input type="number" name="modelYear" min="1950" max="2100" class="form-control" placeholder="örn. 2018">
    </div>

    <div class="col-12 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Kaydet</button>
    </div>
  </form>

  <!-- KAYITLI ARAÇLAR -->
  <div class="card">
    <div class="card-header fw-semibold">Kayıtlı Arabalar</div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width: 22%">Müşteri</th>
            <th style="width: 14%">Plaka</th>
            <th style="width: 18%">Marka</th>
            <th style="width: 18%">Model</th>
            <th style="width: 12%">Model Yılı</th>
            <th style="width: 16%" class="text-end">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="car : ${cars}">
            <!-- Güncelleme formunun ID'si (ayrı, tr dışında tanımlı) -->
            <td>
              <select class="form-select form-select-sm" name="customerId" required th:form="'upd-' + ${car.id}">
                <option th:each="c : ${customers}" th:value="${c.id}"
                        th:selected="${car.customer != null and car.customer.id == c.id}"
                        th:text="${c.name + ' (' + c.email + ')'}"></option>
              </select>
            </td>

            <td>
              <input class="form-control form-control-sm" name="plate"
                     th:value="${car.plate}" required th:form="'upd-' + ${car.id}"
                     oninput="this.value=this.value.toUpperCase()">
            </td>

            <td>
              <select class="form-select form-select-sm brand-dd"
                      name="brandId" required th:form="'upd-' + ${car.id}"
                      th:attr="data-row=${car.id}">
                <option value="" disabled>Seçin…</option>
                <option th:each="b : ${brands}" th:value="${b.id}"
                        th:selected="${car.brand != null and car.brand.id == b.id}"
                        th:text="${b.name}"></option>
              </select>
            </td>

            <td>
              <select class="form-select form-select-sm model-dd"
                      name="modelId" required th:form="'upd-' + ${car.id}"
                      th:attr="data-row=${car.id}">
                <option th:if="${car.model != null}" th:value="${car.model.id}"
                        th:text="${car.model.name}" selected></option>
                <option th:if="${car.model == null}" value="" disabled selected>Önce marka seçin…</option>
              </select>
            </td>

            <td>
              <input type="number" min="1950" max="2100" class="form-control form-control-sm"
                     name="modelYear" th:value="${car.modelYear}" th:form="'upd-' + ${car.id}">
            </td>

            <td class="text-end">
              <!-- Güncelle & Sil butonları ilgili formlara bağlı -->
              <button class="btn btn-sm btn-primary" th:form="'upd-' + ${car.id}" type="submit">Güncelle</button>
              <button class="btn btn-sm btn-outline-danger" th:form="'del-' + ${car.id}" type="submit"
                      onclick="return confirm('Silinsin mi?')">Sil</button>
            </td>
          </tr>

          <!-- Sil & Güncelleme formları (tr dışında, geçerli HTML) -->
          <tr th:each="car : ${cars}">
            <td colspan="6" class="p-0 border-0">
              <!-- Güncelle formu -->
              <form th:id="'upd-' + ${car.id}" th:action="@{'/cars/' + ${car.id} + '/update'}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              </form>
              <!-- Sil formu -->
              <form th:id="'del-' + ${car.id}" th:action="@{'/cars/' + ${car.id} + '/delete'}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(cars)}">
            <td colspan="6" class="text-center text-muted py-4">Henüz kayıtlı araba yok.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- JS -->
<script>
  // EKLEME formu: marka -> modeller
  const brandSelect = document.getElementById('brandSelect');
  const modelSelect = document.getElementById('modelSelect');

  async function loadModelsForCreate(brandId) {
    modelSelect.innerHTML = '<option value="" disabled selected>Yükleniyor…</option>';
    modelSelect.disabled = true;
    try {
      const res = await fetch(`/api/brands/${brandId}/models`);
      const list = await res.json();
      modelSelect.innerHTML = '<option value="" disabled selected>Model seçin…</option>';
      list.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name;
        modelSelect.appendChild(opt);
      });
      modelSelect.disabled = false;
    } catch (e) {
      modelSelect.innerHTML = '<option value="" disabled>Hata oluştu</option>';
      console.error(e);
    }
  }

  brandSelect?.addEventListener('change', e => {
    const id = e.target.value;
    if (id) loadModelsForCreate(id);
  });

  // TABLO satır-içi güncelleme: marka -> modeller
  document.querySelectorAll('.brand-dd').forEach(brandDd => {
    brandDd.addEventListener('change', async (e) => {
      const rowId = e.target.getAttribute('data-row');
      const modelDd = document.querySelector(`.model-dd[data-row="${rowId}"]`);
      modelDd.innerHTML = '<option value="" disabled selected>Yükleniyor…</option>';
      modelDd.disabled = true;

      try {
        const res = await fetch(`/api/brands/${e.target.value}/models`);
        const list = await res.json();
        modelDd.innerHTML = '<option value="" disabled selected>Model seçin…</option>';
        list.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          modelDd.appendChild(opt);
        });
        modelDd.disabled = false;
      } catch (e2) {
        modelDd.innerHTML = '<option value="" disabled>Hata oluştu</option>';
        console.error(e2);
      }
    });
  });
</script>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
